<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complete an export</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main>
      <h1>Complete an export</h1>
      <form method="post" action="/" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="job-id">Job id</label>
        <input id="job-id" name="job_id" value="{{ job_id }}" autocomplete="off">
        <label for="content">Content</label>
        {#- The newline after <textarea> is dropped by the HTML parser, so content keeps a leading newline. #}
        <textarea id="content" name="content" rows="4">
{{ content }}</textarea>
        <button type="submit">Complete export</button>
      </form>
      <p role="status">{{ message }}</p>
    </main>
  </body>
</html>
