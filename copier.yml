# ProjectStarter: Copier template for agent-ready projects.
# Usage: uvx copier copy <path-or-git-url-of-ProjectStarter> <destination>
_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_envops:
  keep_trailing_newline: true

project_name:
  type: str
  help: Project name (letters, digits, '-' or '_')
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_-]*$')) %}
    Use letters, digits, '-' or '_', starting with a letter.
    {% endif %}

project_description:
  type: str
  help: One sentence - who uses this and for what
  default: "<who> uses this to <do what>"

stack:
  type: str
  help: Language / tech stack
  choices:
    TypeScript (Node): typescript
    Python: python
    C# (.NET): dotnet
    Go: go
    Rust: rust
  default: typescript

agent_tools:
  type: str
  help: AI coding agents this repo must support
  multiselect: true
  choices:
    Claude Code: claude
    Codex: codex
  default: [claude, codex]

guardrail_owner:
  type: str
  help: >-
    Optional. GitHub owner of guardrail files (@user or @org/team).
    Leave empty to skip .github/CODEOWNERS.
  default: ""
  validator: >-
    {% if guardrail_owner and not (guardrail_owner | regex_search('^@[A-Za-z0-9][A-Za-z0-9-]*(/[A-Za-z0-9._-]+)?$')) %}
    Use @user or @org/team, or leave empty.
    {% endif %}

risk_paths:
  type: yaml
  help: Tier-3 (high risk) paths that always need owner review (YAML list)
  default: "[auth/, payments/, migrations/, infra/]"

containerize:
  type: bool
  help: Add a Dockerfile (multi-stage, non-root), compose.yaml and hadolint checks
  default: true

datastores:
  type: str
  help: Datastores to wire in as adapters behind application ports (integration tests use Testcontainers, so they need Docker)
  multiselect: true
  choices:
    PostgreSQL: postgres
    MySQL: mysql
    MariaDB: mariadb
    SQL Server: sqlserver
    MongoDB: mongodb
    DynamoDB: dynamodb
    Cosmos DB: cosmosdb
    Redis: redis
  default: []
  validator: >-
    {% if 'mysql' in datastores and 'mariadb' in datastores %}
    Pick MySQL or MariaDB, not both: they share one adapter.
    {% endif %}

http_api:
  type: bool
  help: >-
    Serve the use case over HTTP (TypeScript: Hono, Python: FastAPI, .NET: ASP.NET Core, Go: net/http, Rust: axum) with
    Playwright API tests and an OWASP ZAP baseline scan
  default: false

frontend:
  type: str
  help: Web UI for the TypeScript stack, as a driving adapter over the same use cases
  when: "{{ stack == 'typescript' }}"
  choices:
    None: none
    React (Vite): react
    Vue (Vite): vue
    Next.js: nextjs
    Angular: angular
    React Native (Expo): react-native
  default: none

# ---------- computed values (never asked) ----------
sql_store:
  type: bool
  when: false
  default: "{{ 'postgres' in datastores or 'mysql' in datastores or 'mariadb' in datastores or 'sqlserver' in datastores }}"

# MySQL and MariaDB share the MySQL adapter; this picks the server image.
mysql_engine:
  type: str
  when: false
  default: "{% if 'mysql' in datastores %}mysql{% elif 'mariadb' in datastores %}mariadb{% endif %}"

package_name:
  type: str
  when: false
  default: "{{ project_name | lower | replace('-', '_') }}"

go_module:
  type: str
  when: false
  default: "{{ project_name | lower }}"

dotnet_name:
  type: str
  when: false
  default: "{% for part in (project_name | replace('_', '-')).split('-') %}{{ part[:1] | upper }}{{ part[1:] }}{% endfor %}"

src_root:
  type: str
  when: false
  default: >-
    {%- if stack == 'python' -%}src/{{ project_name | lower | replace('-', '_') }}
    {%- elif stack == 'go' -%}internal
    {%- elif stack == 'rust' -%}crates
    {%- else -%}src{%- endif -%}

# Commands every generated file refers to (AGENTS.md, CI, hooks). One source of truth per stack.
cmd:
  type: yaml
  when: false
  default: |
    {%- if stack == 'typescript' %}
    install: npm install
    typecheck: npm run typecheck
    lint: npm run lint
    lint_file: npx eslint --max-warnings=0
    arch: npm run arch
    test: npm test
    test_single: npx vitest run path/to/file.test.ts
    fast: npm run verify:fast
    verify: npm run verify
    audit: node ci/npm-audit.mjs
    {%- if datastores %}
    test_integration: npm run test:integration
    {%- endif %}
    {%- if http_api %}
    test_e2e: npm run test:e2e
    {%- endif %}
    {%- if frontend != 'none' %}
    build_ui: npm run build
    test_ui: npm run test:ui
    {%- endif %}
    {%- elif stack == 'python' %}
    install: uv sync
    typecheck: uv run pyright
    lint: uv run ruff check .
    lint_file: uv run ruff check
    arch: uv run lint-imports
    test: uv run pytest
    test_single: "uv run pytest tests/test_file.py::test_name"
    fast: uv run pyright && uv run ruff check . && uv run lint-imports
    verify: uv run pyright && uv run ruff check . && uv run ruff format --check . && uv run lint-imports && uv run pytest
    audit: uv audit --locked --preview-features audit-command
    {%- if datastores %}
    test_integration: uv run pytest -m integration
    {%- endif %}
    {%- if http_api %}
    test_e2e: uv run pytest -m e2e
    {%- endif %}
    {%- elif stack == 'dotnet' %}
    install: dotnet restore
    typecheck: dotnet build --no-restore
    lint: dotnet format --verify-no-changes
    lint_file: dotnet format whitespace --folder --verify-no-changes --include
    arch: dotnet test --filter-trait "Category=Architecture"
    test: dotnet test
    test_single: 'dotnet test --filter-method "*.ClassName.MethodName"'
    fast: dotnet build
    verify: dotnet build && dotnet format --verify-no-changes --no-restore && dotnet test --no-build{% if datastores %} --filter-not-trait "Category=Integration"{% endif %}{% if http_api %} --filter-not-trait "Category=E2E"{% endif %}
    audit: dotnet restore --force-evaluate
    {%- if datastores %}
    test_integration: dotnet test --filter-trait "Category=Integration"
    {%- endif %}
    {%- if http_api %}
    test_e2e: dotnet test --filter-trait "Category=E2E"
    {%- endif %}
    {%- elif stack == 'go' %}
    install: go mod tidy
    typecheck: go build ./...
    lint: go tool golangci-lint run
    lint_file: bash ci/lint-file.sh
    arch: go tool golangci-lint run --enable-only depguard
    test: go test ./...
    test_single: go test ./internal/domain -run TestName
    fast: go vet ./... && go tool golangci-lint run
    verify: go vet ./... && go tool golangci-lint run && go test ./...
    audit: go tool govulncheck ./...
    {%- if datastores %}
    test_integration: go test -tags integration ./...
    {%- endif %}
    {%- if http_api %}
    test_e2e: go test -tags e2e ./...
    {%- endif %}
    {%- elif stack == 'rust' %}
    install: cargo fetch
    typecheck: cargo check --workspace --all-targets
    lint: cargo clippy --workspace --all-targets -- -D warnings
    lint_file: bash ci/lint-file.sh
    arch: bash ci/check-layers.sh
    test: cargo test --workspace
    test_single: cargo test -p domain test_name
    fast: cargo clippy --workspace --all-targets -- -D warnings && bash ci/check-layers.sh
    verify: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && bash ci/check-layers.sh && cargo test --workspace
    audit: cargo deny check advisories
    {%- if datastores %}
    test_integration: cargo test -p adapters --features integration
    {%- endif %}
    {%- if http_api %}
    test_e2e: npm --prefix e2e install --no-audit --no-fund && npm --prefix e2e test
    {%- endif %}
    {%- endif %}
    {%- if sql_store %}
    sql_lint: uvx sqlfluff==4.5.0 lint migrations
    {%- endif %}

# Stack facts shared by AGENTS.md, the ratchet script, CODEOWNERS and the Claude Code hooks.
stk:
  type: yaml
  when: false
  default: |
    {%- if stack == 'typescript' %}
    language: TypeScript
    guardrail_files: [tsconfig.json, eslint.config.mjs, .dependency-cruiser.cjs, .audit-exceptions.json, .gitleaks.toml{% if containerize %}, .hadolint.yaml{% if http_api or frontend != 'none' %}, .zap/rules.tsv{% endif %}{% endif %}{% if sql_store %}, .sqlfluff{% if mysql_engine %}, migrations/mysql/.sqlfluff{% endif %}{% if 'sqlserver' in datastores %}, migrations/sqlserver/.sqlfluff{% endif %}{% endif %}]
    escapes_display: "`eslint-disable`, `@ts-ignore`, `@ts-expect-error`, `as any`, `as unknown as`, `.skip`/`.only`"
    ratchet_patterns: ['eslint-disable', '@ts-ignore', '@ts-expect-error', 'as any\b', 'as unknown as', 'NOSONAR']
    src_globs: ['*.ts', '*.tsx']
    test_globs: ['*.test.ts', '*.test.tsx']
    skip_regex: '\b(it|test|describe)\.(skip|only)\('
    lint_exts: '*.ts|*.tsx|*.mts|*.cts'
    layers: {domain: src/domain, application: src/application, adapters: src/adapters, bootstrap: src/bootstrap}
    {%- elif stack == 'python' %}
    language: Python
    guardrail_files: [pyrightconfig.json, ruff.toml, .importlinter, .gitleaks.toml{% if containerize %}, .hadolint.yaml{% if http_api %}, .zap/rules.tsv{% endif %}{% endif %}{% if sql_store %}, .sqlfluff{% if mysql_engine %}, migrations/mysql/.sqlfluff{% endif %}{% if 'sqlserver' in datastores %}, migrations/sqlserver/.sqlfluff{% endif %}{% endif %}]
    escapes_display: "`# type: ignore`, `# pyright: ignore`, `# noqa`, `cast(Any, ...)`, `pytest.mark.skip`/`xfail`"
    ratchet_patterns: ['type:[[:space:]]*ignore', 'pyright:[[:space:]]*ignore', 'noqa', 'cast\(Any']
    src_globs: ['*.py']
    test_globs: ['test_*.py', '*_test.py']
    skip_regex: 'pytest\.mark\.(skip|xfail)|pytest\.skip\('
    lint_exts: '*.py|*.pyi'
    layers: {domain: "{{ src_root }}/domain", application: "{{ src_root }}/application", adapters: "{{ src_root }}/adapters", bootstrap: "{{ src_root }}/bootstrap"}
    {%- elif stack == 'dotnet' %}
    language: C#
    guardrail_files: [Directory.Build.props, .editorconfig, BannedSymbols.txt, CodeMetricsConfig.txt, .gitleaks.toml{% if containerize %}, .hadolint.yaml{% if http_api %}, .zap/rules.tsv{% endif %}{% endif %}{% if sql_store %}, .sqlfluff{% if mysql_engine %}, migrations/mysql/.sqlfluff{% endif %}{% if 'sqlserver' in datastores %}, migrations/sqlserver/.sqlfluff{% endif %}{% endif %}]
    escapes_display: "`#pragma warning disable`, `[SuppressMessage]`, `null!`/`default!`, `Skip =` on tests"
    ratchet_patterns: ['#pragma warning disable', 'SuppressMessage', 'null!', 'default!']
    src_globs: ['*.cs']
    test_globs: ['*Tests.cs']
    skip_regex: 'Skip[[:space:]]*='
    lint_exts: '*.cs'
    layers: {domain: "src/{{ dotnet_name }}.Domain", application: "src/{{ dotnet_name }}.Application", adapters: "src/{{ dotnet_name }}.Adapters", bootstrap: "src/{{ dotnet_name }}.Bootstrap"}
    {%- elif stack == 'go' %}
    language: Go
    guardrail_files: [.golangci.yml, .gitleaks.toml{% if containerize %}, .hadolint.yaml{% if http_api %}, .zap/rules.tsv{% endif %}{% endif %}{% if sql_store %}, .sqlfluff{% if mysql_engine %}, migrations/mysql/.sqlfluff{% endif %}{% if 'sqlserver' in datastores %}, migrations/sqlserver/.sqlfluff{% endif %}{% endif %}]
    escapes_display: "`//nolint`, `//lint:ignore`, `#nosec`, `unsafe`, `t.Skip`"
    ratchet_patterns: ['//[[:space:]]*nolint', '//lint:ignore', '#nosec', 'unsafe\.']
    src_globs: ['*.go']
    test_globs: ['*_test.go']
    skip_regex: 't\.Skip(Now|f)?\('
    lint_exts: '*.go'
    layers: {domain: internal/domain, application: internal/application, adapters: internal/adapters, bootstrap: internal/bootstrap}
    {%- elif stack == 'rust' %}
    language: Rust
    guardrail_files: [Cargo.toml, rust-toolchain.toml, clippy.toml, crates/domain/clippy.toml, crates/application/clippy.toml, deny.toml, .gitleaks.toml{% if containerize %}, .hadolint.yaml{% if http_api %}, .zap/rules.tsv{% endif %}{% endif %}{% if sql_store %}, .sqlfluff{% if mysql_engine %}, migrations/mysql/.sqlfluff{% endif %}{% if 'sqlserver' in datastores %}, migrations/sqlserver/.sqlfluff, crates/adapters/clippy.toml{% endif %}{% endif %}]
    escapes_display: "`#[allow(...)]`, `#[expect(...)]`, `unsafe`, `AssertSqlSafe`, `#[ignore]`"
    ratchet_patterns: ['#!?\[(allow|expect)\(', 'unsafe[[:space:]]*\{', 'AssertSqlSafe']
    src_globs: ['*.rs']
    test_globs: ['tests/*.rs']
    skip_regex: '#\[ignore'
    lint_exts: '*.rs'
    layers: {domain: crates/domain, application: crates/application, adapters: crates/adapters, bootstrap: crates/bootstrap}
    {%- endif %}

_message_after_copy: |
  Created {{ project_name }} ({{ stack }}).
  Next:
    1. cd {{ _copier_conf.dst_path }}
    2. {{ cmd.install }}
    3. {{ cmd.verify }}
    4. Fill docs/feature-map.md and follow docs/roadmap.md (phase 0 -> 2).
